<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tetris Pro - Fixed</title>
    <style>
        body {
            background: #111;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #scaler { transform-origin: center center; display: flex; align-items: center; justify-content: center; }

        #game-container {
            display: flex;
            gap: 20px;
            padding: 25px;
            background: #1a1a20;
            border: 2px solid #333;
            border-radius: 8px;
            position: relative;
        }

        .panel { display: flex; flex-direction: column; gap: 15px; width: 120px; }

        canvas {
            background: #000;
            border: 1px solid #444;
            image-rendering: pixelated;
        }

        .stat-box {
            background: #252530;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
            border: 1px solid #3d3d4d;
        }

        .label { font-size: 11px; color: #888; text-transform: uppercase; margin-bottom: 4px; }
        .value { font-size: 22px; font-weight: bold; font-variant-numeric: tabular-nums; }

        #overlay, #start-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            text-align: center;
        }

        button {
            background: #3877FF;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover { background: #2a5bcc; }

        .fs-btn {
            position: fixed; bottom: 10px; right: 10px;
            background: none; border: 1px solid #444; color: #666; padding: 5px 10px; font-size: 10px;
        }
    </style>
</head>
<body>

    <button class="fs-btn" onclick="toggleFullscreen()">FULLSCREEN (F)</button>

    <div id="scaler">
        <div id="game-container">
            <div class="panel">
                <div class="stat-box">
                    <div class="label">Hold (C)</div>
                    <canvas id="hold" width="80" height="80"></canvas>
                </div>
                <div class="stat-box">
                    <div class="label">Score</div>
                    <div class="value" id="score">0</div>
                </div>
            </div>

            <div style="position: relative;">
                <canvas id="tetris" width="240" height="480"></canvas>
                
                <div id="overlay" style="display: none;"><h1>PAUSED</h1></div>

                <div id="start-screen">
                    <h1 id="title-text">TETRIS</h1>
                    <div class="stat-box" style="margin-bottom: 15px;">
                        <div class="label">Lines Cleared</div>
                        <div class="value" id="final-lines">0</div>
                    </div>
                    <button onclick="startGame()">Start Game</button>
                </div>
            </div>

            <div class="panel">
                <div class="stat-box">
                    <div class="label">Next</div>
                    <canvas id="next" width="80" height="240"></canvas>
                </div>
                <div class="stat-box">
                    <div class="label">Level</div>
                    <div class="value" id="level">1</div>
                </div>
                <div class="stat-box">
                    <div class="label">Lines</div>
                    <div class="value" id="lines">0</div>
                </div>
            </div>
        </div>
    </div>

<script>
    const canvas = document.getElementById('tetris');
    const ctx = canvas.getContext('2d');
    const nextCanvas = document.getElementById('next');
    const nextCtx = nextCanvas.getContext('2d');
    const holdCanvas = document.getElementById('hold');
    const holdCtx = holdCanvas.getContext('2d');

    // Scale 1 unit = 24px (10x20 grid)
    ctx.scale(24, 24);
    nextCtx.scale(20, 20);
    holdCtx.scale(20, 20);

    const PALETTE = [
        null,
        '#00f0f0', // I
        '#f0a000', // L
        '#0000f0', // J
        '#f0f000', // O
        '#f00000', // Z
        '#00f000', // S
        '#a000f0', // T
    ];

    function createPiece(type) {
        if (type === 'I') return [[0,1,0,0],[0,1,0,0],[0,1,0,0],[0,1,0,0]];
        if (type === 'L') return [[0,2,0],[0,2,0],[0,2,2]];
        if (type === 'J') return [[0,3,0],[0,3,0],[3,3,0]];
        if (type === 'O') return [[4,4],[4,4]];
        if (type === 'Z') return [[5,5,0],[0,5,5],[0,0,0]];
        if (type === 'S') return [[0,6,6],[6,6,0],[0,0,0]];
        if (type === 'T') return [[0,7,0],[7,7,7],[0,0,0]];
    }

    let arena = createMatrix(10, 20);
    let player = {
        pos: {x: 0, y: 0},
        matrix: null,
        next: [],
        hold: null,
        canHold: true,
        score: 0,
        level: 1,
        lines: 0
    };

    let dropCounter = 0;
    let dropInterval = 1000;
    let lastTime = 0;
    let isPaused = false;
    let isRunning = false;
    let bag = [];

    function createMatrix(w, h) {
        return Array.from({length: h}, () => Array(w).fill(0));
    }

    function getNextPiece() {
        if (bag.length === 0) {
            bag = ['I','L','J','O','Z','S','T'];
            for (let i = bag.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [bag[i], bag[j]] = [bag[j], bag[i]];
            }
        }
        return createPiece(bag.pop());
    }

    function draw() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Draw Grid Lines
        ctx.strokeStyle = '#111';
        ctx.lineWidth = 0.05;
        for(let i=0; i<10; i++) ctx.strokeRect(i, 0, 1, 20);
        for(let i=0; i<20; i++) ctx.strokeRect(0, i, 10, 1);

        drawMatrix(arena, {x: 0, y: 0}, ctx);
        
        if (isRunning) {
            // Ghost
            const ghost = { pos: {...player.pos}, matrix: player.matrix };
            while (!collide(arena, ghost)) ghost.pos.y++;
            ghost.pos.y--;
            drawMatrix(ghost.matrix, ghost.pos, ctx, true);

            drawMatrix(player.matrix, player.pos, ctx);
        }
        
        updateSideCanvases();
    }

    function drawMatrix(matrix, offset, context, isGhost = false) {
        matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    context.fillStyle = isGhost ? 'rgba(255,255,255,0.1)' : PALETTE[value];
                    context.fillRect(x + offset.x, y + offset.y, 1, 1);
                    if(!isGhost) {
                        context.strokeStyle = 'rgba(0,0,0,0.5)';
                        context.lineWidth = 0.05;
                        context.strokeRect(x + offset.x, y + offset.y, 1, 1);
                    }
                }
            });
        });
    }

    function collide(arena, player) {
        const [m, o] = [player.matrix, player.pos];
        for (let y = 0; y < m.length; ++y) {
            for (let x = 0; x < m[y].length; ++x) {
                if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) return true;
            }
        }
        return false;
    }

    function merge(arena, player) {
        player.matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) arena[y + player.pos.y][x + player.pos.x] = value;
            });
        });
    }

    function arenaSweep() {
        let rowCount = 0;
        outer: for (let y = arena.length - 1; y >= 0; --y) {
            for (let x = 0; x < arena[y].length; ++x) {
                if (arena[y][x] === 0) continue outer;
            }
            const row = arena.splice(y, 1)[0].fill(0);
            arena.unshift(row);
            ++y;
            rowCount++;
        }
        if (rowCount > 0) {
            player.lines += rowCount;
            player.score += [0, 100, 300, 500, 800][rowCount] * player.level;
            if (player.lines >= player.level * 10) {
                player.level++;
                dropInterval = Math.max(100, 1000 - (player.level * 100));
            }
            updateUI();
        }
    }

    function playerReset() {
        if (player.next.length === 0) {
            while(player.next.length < 3) player.next.push(getNextPiece());
        }
        player.matrix = player.next.shift();
        player.next.push(getNextPiece());
        player.pos.y = 0;
        player.pos.x = Math.floor(arena[0].length / 2) - Math.floor(player.matrix[0].length / 2);
        player.canHold = true;

        if (collide(arena, player)) {
            isRunning = false;
            document.getElementById('start-screen').style.display = 'flex';
            document.getElementById('title-text').innerText = "GAME OVER";
            document.getElementById('final-lines').innerText = player.lines;
        }
    }

    function playerDrop() {
        player.pos.y++;
        if (collide(arena, player)) {
            player.pos.y--;
            merge(arena, player);
            playerReset();
            arenaSweep();
        }
        dropCounter = 0;
    }

    function playerHold() {
        if (!player.canHold) return;
        
        // Find the piece type from the matrix value
        let val = 0;
        player.matrix.forEach(row => row.forEach(v => { if(v!==0) val = v; }));
        const types = [null, 'I', 'L', 'J', 'O', 'Z', 'S', 'T'];
        const currentMatrix = createPiece(types[val]);

        if (!player.hold) {
            player.hold = currentMatrix;
            playerReset();
        } else {
            const temp = player.hold;
            player.hold = currentMatrix;
            player.matrix = temp;
            player.pos.y = 0;
            player.pos.x = Math.floor(arena[0].length / 2) - Math.floor(player.matrix[0].length / 2);
        }
        player.canHold = false;
    }

    function updateSideCanvases() {
        // Next
        nextCtx.fillStyle = '#252530';
        nextCtx.fillRect(0, 0, 4, 12);
        player.next.forEach((m, i) => drawMatrix(m, {x: 0.5, y: i * 4 + 0.5}, nextCtx));

        // Hold
        holdCtx.fillStyle = '#252530';
        holdCtx.fillRect(0, 0, 4, 4);
        if (player.hold) drawMatrix(player.hold, {x: 0.5, y: 0.5}, holdCtx);
    }

    function updateUI() {
        document.getElementById('score').innerText = player.score;
        document.getElementById('level').innerText = player.level;
        document.getElementById('lines').innerText = player.lines;
    }

    function update(time = 0) {
        if (!isRunning || isPaused) return;
        const deltaTime = time - lastTime;
        lastTime = time;
        dropCounter += deltaTime;
        if (dropCounter > dropInterval) playerDrop();
        draw();
        requestAnimationFrame(update);
    }

    function startGame() {
        arena = createMatrix(10, 20);
        player.score = 0; player.level = 1; player.lines = 0;
        player.next = []; player.hold = null;
        updateUI();
        playerReset();
        isRunning = true;
        isPaused = false;
        document.getElementById('start-screen').style.display = 'none';
        update();
    }

    // Controls
    document.addEventListener('keydown', e => {
        if (e.key === 'f') toggleFullscreen();
        if (!isRunning) return;
        if (e.key === 'p') {
            isPaused = !isPaused;
            document.getElementById('overlay').style.display = isPaused ? 'flex' : 'none';
            if (!isPaused) update();
        }
        if (isPaused) return;

        if (e.key === 'ArrowLeft') { player.pos.x--; if(collide(arena, player)) player.pos.x++; }
        if (e.key === 'ArrowRight') { player.pos.x++; if(collide(arena, player)) player.pos.x--; }
        if (e.key === 'ArrowDown') playerDrop();
        if (e.key === 'ArrowUp') {
            const pos = player.pos.x;
            let offset = 1;
            const m = player.matrix;
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < y; ++x) [m[x][y], m[y][x]] = [m[y][x], m[x][y]];
            }
            m.forEach(row => row.reverse());
            while(collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > m[0].length) { // Rotate back if stuck
                    m.forEach(row => row.reverse());
                    for (let y = 0; y < m.length; ++y) {
                        for (let x = 0; x < y; ++x) [m[x][y], m[y][x]] = [m[y][x], m[x][y]];
                    }
                    player.pos.x = pos;
                    return;
                }
            }
        }
        if (e.key === ' ') {
            while(!collide(arena, player)) player.pos.y++;
            player.pos.y--;
            merge(arena, player);
            playerReset();
            arenaSweep();
        }
        if (e.key.toLowerCase() === 'c' || e.key === 'Shift') playerHold();
    });

    function toggleFullscreen() {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
    }

    function resize() {
        const scale = Math.min(window.innerWidth / 600, window.innerHeight / 700);
        document.getElementById('scaler').style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', resize);
    resize();
</script>
</body>
</html>
