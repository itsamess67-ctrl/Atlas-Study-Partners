<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tetris Fullscreen</title>
    <style>
        body {
            background: #111;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            overflow: hidden; /* Prevent scrolling */
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
        }

        /* The Scaler div holds the game and transforms it to fit the screen */
        #scaler {
            transform-origin: center center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            display: flex;
            gap: 20px; /* Space between board and panels */
            padding: 20px;
            background: #202028;
            border: 2px solid #444;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            position: relative;
        }

        .panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 120px; 
        }

        canvas {
            background: #000;
            border: 2px solid #333;
            /* Critical for retro look when scaling up */
            image-rendering: pixelated; 
            image-rendering: crisp-edges;
        }

        #tetris {
            border: 4px solid #555;
            background: rgba(0,0,0,0.5);
        }

        .stat-box {
            background: #333;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
            border: 1px solid #444;
        }

        .label {
            font-size: 12px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .value {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
        }

        /* UI Overlays */
        #overlay, #start-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        h1 { margin: 0 0 20px 0; font-size: 40px; color: #fff; text-transform: uppercase; letter-spacing: 5px; }
        p { color: #ccc; margin-bottom: 30px; font-size: 14px; text-align: center; line-height: 1.5; }
        
        button {
            background: #fff;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        button:hover { background: #ccc; }

        /* Mobile Controls (hidden on desktop usually, but useful for touch) */
        #mobile-controls { display: none; }
        
        .fs-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: transparent;
            color: #555;
            border: 1px solid #555;
            padding: 5px 10px;
            font-size: 12px;
            cursor: pointer;
            z-index: 100;
        }
        .fs-btn:hover { color: #fff; border-color: #fff; }

    </style>
</head>
<body>

    <button class="fs-btn" onclick="toggleFullscreen()">[ ] Fullscreen</button>

    <div id="scaler">
        <div id="game-container">
            
            <div class="panel">
                <div class="stat-box">
                    <div class="label">Hold</div>
                    <canvas id="hold" width="80" height="80"></canvas>
                </div>
                <div class="stat-box">
                    <div class="label">Score</div>
                    <div class="value" id="score">0</div>
                </div>
                <div class="stat-box">
                    <div class="label">Level</div>
                    <div class="value" id="level">1</div>
                </div>
                <div class="stat-box">
                    <div class="label">Lines</div>
                    <div class="value" id="lines">0</div>
                </div>
            </div>

            <div style="position: relative;">
                <canvas id="tetris" width="240" height="400"></canvas>
                
                <div id="overlay" style="display: none;">
                    <h1>PAUSED</h1>
                    <p>Press P to Resume</p>
                </div>

                <div id="start-screen">
                    <h1 id="title-text">TETRIS</h1>
                    <p>
                        ARROWS to Move/Rotate<br>
                        SPACE to Hard Drop<br>
                        SHIFT or C to Hold<br>
                        F for Fullscreen
                    </p>
                    <button onclick="startGame()">Start Game</button>
                </div>
            </div>

            <div class="panel">
                <div class="stat-box">
                    <div class="label">Next</div>
                    <canvas id="next" width="80" height="240"></canvas>
                </div>
            </div>

        </div>
    </div>

<script>
    // --- Resize Logic ---
    const scaler = document.getElementById('scaler');
    const container = document.getElementById('game-container');
    
    // Original dimensions of the widget
    const BASE_WIDTH = 580;  // Approximate width of container
    const BASE_HEIGHT = 500; // Approximate height of container

    function resizeGame() {
        const windowWidth = window.innerWidth;
        const windowHeight = window.innerHeight;
        
        // Calculate the scale to fit the window with a small margin
        const scaleX = windowWidth / BASE_WIDTH;
        const scaleY = windowHeight / BASE_HEIGHT;
        const scale = Math.min(scaleX, scaleY) * 0.90; // 90% of screen

        scaler.style.transform = `scale(${scale})`;
    }

    window.addEventListener('resize', resizeGame);
    window.addEventListener('load', resizeGame);


    // --- Game Logic ---
    const canvas = document.getElementById('tetris');
    const ctx = canvas.getContext('2d');
    const nextCanvas = document.getElementById('next');
    const nextCtx = nextCanvas.getContext('2d');
    const holdCanvas = document.getElementById('hold');
    const holdCtx = holdCanvas.getContext('2d');

    const scoreEl = document.getElementById('score');
    const levelEl = document.getElementById('level');
    const linesEl = document.getElementById('lines');
    const startScreen = document.getElementById('start-screen');
    const overlay = document.getElementById('overlay');
    const titleText = document.getElementById('title-text');

    // Scale drawing contexts for crisp pixels
    ctx.scale(20, 20);
    nextCtx.scale(20, 20);
    holdCtx.scale(20, 20);

    const COLORS = [
        null,
        '#FF0D72', '#0DC2FF', '#0DFF72', '#F538FF', 
        '#FF8E0D', '#FFE138', '#3877FF'
    ];

    const PIECES = 'ILJOTSZ'; // Mapped by index 1-7

    // Game State
    let arena = createMatrix(12, 20);
    let player = {
        pos: {x: 0, y: 0},
        matrix: null,
        score: 0,
        level: 1,
        lines: 0,
        next: [],
        hold: null,
        canHold: true
    };

    let dropCounter = 0;
    let dropInterval = 1000;
    let lastTime = 0;
    let isPaused = false;
    let isRunning = false;
    let requestID = null;
    let bag = [];

    // --- Helpers ---
    function createMatrix(w, h) {
        const matrix = [];
        while (h--) matrix.push(new Array(w).fill(0));
        return matrix;
    }

    function createPiece(type) {
        if (type === 'I') return [[0,1,0,0],[0,1,0,0],[0,1,0,0],[0,1,0,0]];
        if (type === 'L') return [[0,2,0],[0,2,0],[0,2,2]];
        if (type === 'J') return [[0,3,0],[0,3,0],[3,3,0]];
        if (type === 'O') return [[4,4],[4,4]];
        if (type === 'Z') return [[5,5,0],[0,5,5],[0,0,0]];
        if (type === 'S') return [[0,6,6],[6,6,0],[0,0,0]];
        if (type === 'T') return [[0,7,0],[7,7,7],[0,0,0]];
    }

    function getNextPiece() {
        if (bag.length === 0) {
            bag = 'ILJOTSZ'.split('');
            // Fisher-Yates Shuffle
            for (let i = bag.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [bag[i], bag[j]] = [bag[j], bag[i]];
            }
        }
        return createPiece(bag.pop());
    }

    function drawMatrix(matrix, offset, ctxToUse, ghost=false) {
        matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    if (ghost) {
                        ctxToUse.fillStyle = 'rgba(255,255,255,0.1)';
                        ctxToUse.fillRect(x + offset.x, y + offset.y, 1, 1);
                        ctxToUse.lineWidth = 0.05;
                        ctxToUse.strokeStyle = 'rgba(255,255,255,0.3)';
                        ctxToUse.strokeRect(x + offset.x, y + offset.y, 1, 1);
                    } else {
                        // Base color
                        ctxToUse.fillStyle = COLORS[value];
                        ctxToUse.fillRect(x + offset.x, y + offset.y, 1, 1);
                        // Shading
                        ctxToUse.lineWidth = 0.05;
                        ctxToUse.strokeStyle = 'rgba(0,0,0,0.5)';
                        ctxToUse.strokeRect(x + offset.x, y + offset.y, 1, 1);
                        
                        // Shine
                        ctxToUse.fillStyle = 'rgba(255,255,255,0.2)';
                        ctxToUse.fillRect(x + offset.x, y + offset.y, 0.2, 1);
                        ctxToUse.fillRect(x + offset.x, y + offset.y, 1, 0.2);
                    }
                }
            });
        });
    }

    function draw() {
        // Main Board
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        drawMatrix(arena, {x:0, y:0}, ctx);

        if(!isPaused && isRunning) {
            // Ghost
            let ghostPos = {...player.pos};
            while(!collide(arena, {pos: ghostPos, matrix: player.matrix})) {
                ghostPos.y++;
            }
            ghostPos.y--;
            drawMatrix(player.matrix, ghostPos, ctx, true);

            // Player
            drawMatrix(player.matrix, player.pos, ctx);
        }

        // Next Queue
        nextCtx.fillStyle = '#222';
        nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
        let yOff = 1;
        player.next.forEach(p => {
            // Center roughly
            const xOff = (4 - p[0].length) / 2;
            drawMatrix(p, {x: xOff, y: yOff}, nextCtx);
            yOff += 4;
        });

        // Hold
        holdCtx.fillStyle = '#222';
        holdCtx.fillRect(0, 0, holdCanvas.width, holdCanvas.height);
        if(player.hold) {
            const xOff = (4 - player.hold[0].length) / 2;
            const yOff = (4 - player.hold.length) / 2;
            drawMatrix(player.hold, {x: xOff, y: yOff}, holdCtx);
        }
    }

    function collide(arena, player) {
        const m = player.matrix;
        const o = player.pos;
        for(let y=0; y<m.length; ++y) {
            for(let x=0; x<m[y].length; ++x) {
                if(m[y][x] !== 0 && (arena[y+o.y] && arena[y+o.y][x+o.x]) !== 0) {
                    return true;
                }
            }
        }
        return false;
    }

    function merge(arena, player) {
        player.matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if(value !== 0) arena[y+player.pos.y][x+player.pos.x] = value;
            });
        });
    }

    function rotate(matrix, dir) {
        for(let y=0; y<matrix.length; ++y) {
            for(let x=0; x<y; ++x) [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
        }
        if(dir > 0) matrix.forEach(row => row.reverse());
        else matrix.reverse();
    }

    function playerRotate(dir) {
        const pos = player.pos.x;
        let offset = 1;
        rotate(player.matrix, dir);
        while(collide(arena, player)) {
            player.pos.x += offset;
            offset = -(offset + (offset > 0 ? 1 : -1));
            if(offset > player.matrix[0].length) {
                rotate(player.matrix, -dir);
                player.pos.x = pos;
                return;
            }
        }
    }

    function playerReset() {
        if(player.next.length === 0) {
            while(player.next.length < 3) player.next.push(getNextPiece());
        }
        player.matrix = player.next.shift();
        player.next.push(getNextPiece());
        player.pos.y = 0;
        player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
        player.canHold = true;

        if(collide(arena, player)) {
            gameOver();
        }
    }

    function arenaSweep() {
        let rowCount = 0;
        outer: for(let y = arena.length -1; y > 0; --y) {
            for(let x=0; x<arena[y].length; ++x) {
                if(arena[y][x] === 0) continue outer;
            }
            const row = arena.splice(y, 1)[0].fill(0);
            arena.unshift(row);
            ++y;
            rowCount++;
        }
        if(rowCount > 0) {
            player.lines += rowCount;
            player.score += [0, 40, 100, 300, 1200][rowCount] * player.level;
            if(player.lines >= player.level * 10) {
                player.level++;
                dropInterval *= 0.9;
            }
            updateScore();
        }
    }

    function playerHold() {
        if(!player.canHold) return;
        
        // Find raw piece type based on value in matrix
        let val = 0;
        for(let r of player.matrix) for(let c of r) if(c!==0) val = c;
        if(val===0) return; // shouldn't happen

        // Indices match PIECES string? 
        // PIECES = ILJOTSZ. 
        // createPiece logic: I=1, L=2, J=3, O=4, Z=5, S=6, T=7
        const chars = [null,'I','L','J','O','Z','S','T'];
        const type = chars[val];
        const freshPiece = createPiece(type);

        if(!player.hold) {
            player.hold = freshPiece;
            player.matrix = player.next.shift();
            player.next.push(getNextPiece());
        } else {
            const temp = player.hold;
            player.hold = freshPiece;
            player.matrix = temp;
        }
        
        player.pos.y = 0;
        player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
        player.canHold = false;
    }

    function update(time = 0) {
        if(!isRunning) return;
        const deltaTime = time - lastTime;
        lastTime = time;

        if(!isPaused) {
            dropCounter += deltaTime;
            if(dropCounter > dropInterval) {
                player.pos.y++;
                if(collide(arena, player)) {
                    player.pos.y--;
                    merge(arena, player);
                    playerReset();
                    arenaSweep();
                }
                dropCounter = 0;
            }
        }
        draw();
        requestID = requestAnimationFrame(update);
    }

    function updateScore() {
        scoreEl.innerText = player.score;
        levelEl.innerText = player.level;
        linesEl.innerText = player.lines;
    }

    function gameOver() {
        isRunning = false;
        cancelAnimationFrame(requestID);
        titleText.innerText = "GAME OVER";
        startScreen.style.display = 'flex';
    }

    function startGame() {
        arena.forEach(row => row.fill(0));
        player.score = 0;
        player.level = 1;
        player.lines = 0;
        player.next = [];
        player.hold = null;
        dropInterval = 1000;
        bag = [];
        updateScore();
        startScreen.style.display = 'none';
        isPaused = false;
        isRunning = true;
        playerReset();
        update();
    }

    function togglePause() {
        if(!isRunning) return;
        isPaused = !isPaused;
        overlay.style.display = isPaused ? 'flex' : 'none';
    }

    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                console.log(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
            });
        } else {
            document.exitFullscreen();
        }
    }

    // Controls
    document.addEventListener('keydown', event => {
        if(event.key === 'f' || event.key === 'F') {
            toggleFullscreen();
            return;
        }

        if(!isRunning) {
            // Any key starts game if on start screen? No, let's keep it to button for safety
            return;
        }

        if(event.key === 'p' || event.key === 'P') {
            togglePause();
            return;
        }

        if(isPaused) return;

        if(event.keyCode === 37) { // Left
            player.pos.x--;
            if(collide(arena, player)) player.pos.x++;
        } else if(event.keyCode === 39) { // Right
            player.pos.x++;
            if(collide(arena, player)) player.pos.x--;
        } else if(event.keyCode === 40) { // Down
            player.pos.y++;
            if(collide(arena, player)) {
                player.pos.y--; // Let next loop handle merge
            } else {
                dropCounter = 0; // Reset drop timer on manual drop
            }
        } else if(event.keyCode === 38) { // Up (Rotate)
            playerRotate(1);
        } else if(event.keyCode === 32) { // Space (Hard Drop)
            while(!collide(arena, player)) player.pos.y++;
            player.pos.y--;
            merge(arena, player);
            playerReset();
            arenaSweep();
            dropCounter = 0;
        } else if(event.keyCode === 67 || event.keyCode === 16) { // C or Shift
            playerHold();
        }
    });

    // Initial draw to show empty grid
    draw();

</script>
</body>
</html>
