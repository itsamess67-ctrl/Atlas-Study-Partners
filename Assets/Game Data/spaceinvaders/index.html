<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON ARCADE: ULTIMATE</title>
    <style>
        :root {
            --neon-green: #39ff14;
            --neon-pink: #ff0055;
            --neon-blue: #00f2ff;
            --neon-purple: #bc13fe;
            --neon-red: #ff0000;
        }

        body {
            margin: 0;
            background: #050505;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            color: white;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
        }

        canvas {
            display: block;
        }

        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 0 10px var(--neon-green);
            pointer-events: none;
            z-index: 10;
        }

        /* Power-up Status Bar */
        #powerup-bar {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            pointer-events: none;
        }

        .power-badge {
            background: rgba(0,0,0,0.7);
            border: 2px solid white;
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 14px;
            text-transform: uppercase;
            box-shadow: 0 0 15px currentColor;
            animation: bounce 0.5s ease-out;
        }

        /* Start Screen */
        #overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            backdrop-filter: blur(5px);
        }

        h1 {
            font-size: 80px;
            margin: 0 0 20px 0;
            background: linear-gradient(to bottom, var(--neon-green), #2a9d8f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px var(--neon-green));
            text-transform: uppercase;
        }

        p { font-size: 18px; color: #aaa; margin-bottom: 40px; }

        button {
            padding: 15px 50px;
            font-size: 24px;
            background: transparent;
            color: var(--neon-green);
            border: 2px solid var(--neon-green);
            cursor: pointer;
            font-family: inherit;
            text-transform: uppercase;
            transition: 0.2s;
            box-shadow: 0 0 10px var(--neon-green);
        }

        button:hover {
            background: var(--neon-green);
            color: black;
            box-shadow: 0 0 30px var(--neon-green);
        }

        @keyframes bounce { 0% { transform: scale(0); } 80% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <div>SCORE: <span id="score">0</span></div>
        <div>WAVE: <span id="wave">1</span></div>
        <div>LIVES: <span id="lives">3</span></div>
    </div>

    <div id="powerup-bar"></div>

    <div id="overlay">
        <h1>Space Invaders</h1>
        <p>ARROWS to Move • SPACE to Fire</p>
        <button onclick="startGame()">START</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const uiScore = document.getElementById('score');
    const uiWave = document.getElementById('wave');
    const uiLives = document.getElementById('lives');
    const uiPowerups = document.getElementById('powerup-bar');
    const overlay = document.getElementById('overlay');

    let width, height;
    
    // --- EXACT ARCADE SPRITE MAPS ---
    const SPRITES = {
        // === SQUID (Top Row) ===
        // Arms Open
        alien_squid_0: [
            "00011000",
            "00111100",
            "01111110",
            "11011011",
            "11111111",
            "00100100",
            "01011010",
            "10100101"
        ],
        // Arms Up / Legs Out
        alien_squid_1: [
            "00011000",
            "00111100",
            "01111110",
            "11011011",
            "11111111",
            "00011000", // Narrow waist
            "00100100",
            "01000010"  // Feet point out
        ],

        // === CRAB (Middle Rows) ===
        // Arms Up / Flat Feet
        alien_crab_0: [
            "00100000100",
            "00010001000",
            "00111111100",
            "01101110110",
            "11111111111",
            "10111111101",
            "10100000101",
            "00011011000"
        ],
        // Arms Down / Legs In
        alien_crab_1: [
            "00100000100",
            "10010001001", // Antennas tip down
            "10111111101",
            "11101110111",
            "11111111111",
            "00111111100",
            "00100000100",
            "00010001000"  // Feet pull in
        ],

        // === OCTOPUS (Bottom Rows) ===
        // Legs Wide
        alien_octopus_0: [
            "000011110000",
            "011111111110",
            "111111111111",
            "111001100111",
            "111111111111",
            "000110011000",
            "001101101100",
            "110000000011"
        ],
        // Legs Narrow
        alien_octopus_1: [
            "000011110000",
            "011111111110",
            "111111111111",
            "111001100111",
            "111111111111",
            "000110011000",
            "001000000100", // Legs vertical
            "000100001000"  // Feet small
        ],

        // Player Tank
        player: [
            "00000100000",
            "00001110000",
            "00001110000",
            "01111111110",
            "11111111111",
            "11111111111",
            "11111111111",
            "11111111111"
        ],
        // Mystery Ship (UFO)
        ufo: [
            "0000011111100000",
            "0001111111111000",
            "0011111111111100",
            "0110110110110110",
            "1111111111111111",
            "0011100110011100",
            "0001000000001000"
        ]
    };

    // --- Bunker Map ---
    const BUNKER_MAP = [
        "000011111111110000",
        "001111111111111100",
        "111111111111111111",
        "111111111111111111",
        "111111111111111111",
        "111111111111111111",
        "111111111111111111",
        "111111111111111111",
        "111111000000111111",
        "111111000000111111",
        "111111000000111111",
        "111111000000111111"
    ];

    // --- Game Constants ---
    const PIXEL_SCALE = 3; 
    let gameActive = false;
    let score = 0, wave = 1, lives = 3;
    let screenShake = 0;

    // --- Audio ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, type, dur, vol=0.1) {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(Math.max(1, freq/2), audioCtx.currentTime + dur);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + dur);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
    }

    // --- Classes ---

    class GameObject {
        constructor(x, y, w, h, color) {
            this.x = x; this.y = y; this.w = w; this.h = h;
            this.color = color;
            this.dead = false;
        }
    }

    class PixelSprite extends GameObject {
        constructor(x, y, mapKey, color) {
            super(x, y, 0, 0, color);
            this.map = SPRITES[mapKey];
            this.rows = this.map.length;
            this.cols = this.map[0].length;
            this.w = this.cols * PIXEL_SCALE;
            this.h = this.rows * PIXEL_SCALE;
        }
        draw() {
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 10; 
            ctx.shadowColor = this.color;
            for(let r=0; r<this.rows; r++) {
                for(let c=0; c<this.cols; c++) {
                    if(this.map[r][c] === '1') {
                        ctx.fillRect(this.x + c*PIXEL_SCALE, this.y + r*PIXEL_SCALE, PIXEL_SCALE, PIXEL_SCALE);
                    }
                }
            }
            ctx.shadowBlur = 0;
        }
    }

    class MysteryShip extends PixelSprite {
        constructor() {
            super(width + 50, 45, 'ufo', '#ff0000'); 
            this.speed = 3;
            this.audioOsc = null;
            this.audioGain = null;
            this.startAudio();
        }

        update() {
            this.x -= this.speed;
            if (this.x + this.w < 0) {
                this.dead = true;
                this.stopAudio();
            }
            this.updateAudio();
        }

        startAudio() {
            this.audioOsc = audioCtx.createOscillator();
            this.audioGain = audioCtx.createGain();
            this.audioOsc.type = 'triangle';
            this.audioOsc.connect(this.audioGain);
            this.audioGain.connect(audioCtx.destination);
            this.audioGain.gain.value = 0.05;
            this.audioOsc.start();
        }

        updateAudio() {
            if (this.audioOsc) {
                const time = Date.now() / 100;
                this.audioOsc.frequency.value = 400 + Math.sin(time) * 150; 
            }
        }

        stopAudio() {
            if (this.audioOsc) {
                this.audioOsc.stop();
                this.audioOsc.disconnect();
                this.audioOsc = null;
            }
        }
    }

    class Bunker {
        constructor(x, y) {
            this.x = x; this.y = y;
            this.pixels = [];
            this.color = '#39ff14'; // Classic Green
            
            // Build pixel array
            for(let r=0; r<BUNKER_MAP.length; r++) {
                for(let c=0; c<BUNKER_MAP[r].length; c++) {
                    if(BUNKER_MAP[r][c] === '1') {
                        this.pixels.push({
                            x: x + c * PIXEL_SCALE,
                            y: y + r * PIXEL_SCALE,
                            active: true
                        });
                    }
                }
            }
        }
        draw() {
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 5; ctx.shadowColor = this.color;
            this.pixels.forEach(p => {
                if(p.active) ctx.fillRect(p.x, p.y, PIXEL_SCALE, PIXEL_SCALE);
            });
            ctx.shadowBlur = 0;
        }
        checkCollision(bullet) {
            if(bullet.x > this.x + 20*PIXEL_SCALE || bullet.x < this.x || bullet.y > this.y + 15*PIXEL_SCALE || bullet.y < this.y) return false;
            for(let p of this.pixels) {
                if(p.active && 
                   bullet.x < p.x + PIXEL_SCALE && 
                   bullet.x + bullet.w > p.x && 
                   bullet.y < p.y + PIXEL_SCALE && 
                   bullet.y + bullet.h > p.y) {
                    p.active = false;
                    createParticles(p.x, p.y, this.color, 2); 
                    return true;
                }
            }
            return false;
        }
    }

    class Player extends PixelSprite {
        constructor() {
            super(0, 0, 'player', '#39ff14'); // Green Tank
            this.x = width/2 - this.w/2;
            this.y = height - 100;
            this.speed = 6;
            this.bullets = [];
            this.powerups = {}; 
            this.lastShot = 0;
        }
        update(keys) {
            if(keys['ArrowLeft'] || keys['a']) this.x = Math.max(20, this.x - this.speed);
            if(keys['ArrowRight'] || keys['d']) this.x = Math.min(width - this.w - 20, this.x + this.speed);

            Object.keys(this.powerups).forEach(k => {
                if(this.powerups[k] > 0) this.powerups[k]--;
                else delete this.powerups[k];
            });
            updatePowerupUI();

            const delay = this.powerups['rapid'] ? 100 : 400;
            if(keys[' '] && Date.now() - this.lastShot > delay) {
                this.shoot();
                this.lastShot = Date.now();
            }
        }
        shoot() {
            playTone(600, 'square', 0.1);
            const bx = this.x + this.w/2 - 2;
            if(this.powerups['triple']) {
                this.bullets.push(new Bullet(bx, this.y, -10, 0, '#fff'));
                this.bullets.push(new Bullet(bx, this.y, -9, -2, '#fff'));
                this.bullets.push(new Bullet(bx, this.y, -9, 2, '#fff'));
            } else {
                this.bullets.push(new Bullet(bx, this.y, -10, 0, '#39ff14'));
            }
        }
        draw() {
            super.draw();
            if(this.powerups['shield']) {
                ctx.strokeStyle = '#00f2ff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(this.x + this.w/2, this.y + this.h/2, 40, 0, Math.PI*2);
                ctx.stroke();
            }
        }
    }

    class Enemy extends PixelSprite {
        constructor(x, y, type, color, points) {
            super(x, y, type + '_0', color); 
            this.baseType = type; 
            this.frame = 0;
            this.points = points;
        }

        toggleFrame() {
            this.frame = this.frame === 0 ? 1 : 0;
            this.map = SPRITES[`${this.baseType}_${this.frame}`];
        }
    }

    class Bullet extends GameObject {
        constructor(x, y, vy, vx, color) {
            super(x, y, 4, 12, color);
            this.vy = vy;
            this.vx = vx || 0;
        }
        update() {
            this.y += this.vy;
            this.x += this.vx;
            if(this.y < 0 || this.y > height) this.dead = true;
        }
        draw() {
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 5; ctx.shadowColor = this.color;
            ctx.fillRect(this.x, this.y, this.w, this.h);
            ctx.shadowBlur = 0;
        }
    }

    class PowerUpItem extends GameObject {
        constructor(x, y, type) {
            super(x, y, 20, 20, type === 'rapid' ? '#ffff00' : (type === 'triple' ? '#ff0055' : '#00f2ff'));
            this.type = type;
            this.vy = 3;
            this.text = type === 'rapid' ? 'R' : (type === 'triple' ? 'T' : 'S');
        }
        update() {
            this.y += this.vy;
            if(this.y > height) this.dead = true;
        }
        draw() {
            ctx.strokeStyle = this.color;
            ctx.strokeRect(this.x, this.y, this.w, this.h);
            ctx.fillStyle = 'white';
            ctx.font = '16px Arial';
            ctx.fillText(this.text, this.x + 5, this.y + 16);
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x; this.y = y; this.color = color;
            this.vx = (Math.random()-0.5) * 8;
            this.vy = (Math.random()-0.5) * 8;
            this.life = 1;
        }
        update() {
            this.x += this.vx; this.y += this.vy; this.life -= 0.04;
        }
        draw() {
            ctx.globalAlpha = Math.max(0, this.life);
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, 4, 4);
            ctx.globalAlpha = 1;
        }
    }

    // --- State & Logic ---
    let player;
    let bunkers = [];
    let enemies = [];
    let enemyBullets = [];
    let particles = [];
    let powerups = [];
    let keys = {};
    let enemyDirection = 1;
    let enemyMoveTimer = 0;
    
    // Mystery UFO Variables
    let mysteryShip = null;
    let ufoTimer = 0;
    let nextUfoSpawn = 0;

    function init() {
        resize();
        player = new Player();
        startWave();
        loop();
    }

    function startWave() {
        enemies = [];
        bunkers = [];
        enemyBullets = [];
        powerups = [];
        
        if(mysteryShip) { mysteryShip.stopAudio(); mysteryShip = null; }
        setNextUfoTime();

        const bunkerCount = 4;
        const spacing = width / (bunkerCount + 1);
        for(let i=1; i<=bunkerCount; i++) {
            bunkers.push(new Bunker(spacing * i - 30, height - 200));
        }

        const startX = (width - (11 * 50)) / 2;
        const startY = 80;

        for(let r=0; r<5; r++) {
            for(let c=0; c<11; c++) {
                let type, color, pts;
                if(r === 0) { type = 'alien_squid'; color = '#ff0055'; pts = 30; }
                else if(r < 3) { type = 'alien_crab'; color = '#00f2ff'; pts = 20; }
                else { type = 'alien_octopus'; color = '#39ff14'; pts = 10; }
                
                enemies.push(new Enemy(startX + c*50, startY + r*45, type, color, pts));
            }
        }
    }

    function setNextUfoTime() {
        nextUfoSpawn = Date.now() + (Math.random() * 5000 + 15000); 
    }

    function createParticles(x, y, c, count=10) {
        for(let i=0; i<count; i++) particles.push(new Particle(x, y, c));
    }

    function update() {
        if(!gameActive) return;

        player.update(keys);

        // --- Mystery UFO Logic ---
        if (!mysteryShip && Date.now() > nextUfoSpawn) {
            mysteryShip = new MysteryShip();
        }

        if (mysteryShip) {
            mysteryShip.update();
            if (mysteryShip.dead) {
                mysteryShip = null;
                setNextUfoTime();
            }
        }

        // Bullets
        player.bullets.forEach(b => {
            b.update();
            
            if (mysteryShip && !mysteryShip.dead && checkRect(b, mysteryShip)) {
                b.dead = true;
                mysteryShip.dead = true;
                mysteryShip.stopAudio();
                mysteryShip = null;
                score += 1000;
                createParticles(b.x, b.y, '#ff0000', 50);
                playTone(1000, 'square', 0.2, 0.3);
                screenShake = 10;
                setNextUfoTime();
            }

            enemies.forEach(e => {
                if(!b.dead && !e.dead && checkRect(b, e)) {
                    b.dead = true; e.dead = true;
                    score += e.points;
                    createParticles(e.x + e.w/2, e.y + e.h/2, e.color, 15);
                    screenShake = 5;
                    playTone(200, 'sawtooth', 0.1);
                    
                    if(Math.random() < 0.05) {
                        const types = ['rapid', 'triple', 'shield'];
                        const t = types[Math.floor(Math.random()*types.length)];
                        powerups.push(new PowerUpItem(e.x, e.y, t));
                    }
                }
            });
            bunkers.forEach(bnk => {
                if(!b.dead && bnk.checkCollision(b)) b.dead = true;
            });
        });

        // Enemies
        enemyMoveTimer++;
        const moveThreshold = Math.max(5, 50 - (wave*5) - ((55-enemies.length)/2)); 
        
        if(enemyMoveTimer > moveThreshold) {
            let drop = false;
            enemies.forEach(e => {
                if((e.x + e.w > width - 20 && enemyDirection === 1) || (e.x < 20 && enemyDirection === -1)) drop = true;
            });
            
            if(drop) {
                enemyDirection *= -1;
                enemies.forEach(e => e.y += 20);
            } else {
                enemies.forEach(e => e.x += 10 * enemyDirection);
            }
            
            // ANIMATION TOGGLE
            enemies.forEach(e => e.toggleFrame());

            enemyMoveTimer = 0;
            playTone(50, 'square', 0.05); 
        }

        if(Math.random() < 0.01 + (wave * 0.005)) {
            const shooter = enemies[Math.floor(Math.random()*enemies.length)];
            if(shooter) {
                enemyBullets.push(new Bullet(shooter.x + shooter.w/2, shooter.y + shooter.h, 6, 0, 'white'));
            }
        }

        enemyBullets.forEach(b => {
            b.update();
            if(!b.dead && checkRect(b, player)) {
                b.dead = true;
                if(player.powerups['shield']) {
                    delete player.powerups['shield'];
                    playTone(400, 'sine', 0.2);
                } else {
                    lives--;
                    screenShake = 20;
                    playTone(100, 'sawtooth', 0.5);
                    createParticles(player.x+player.w/2, player.y+player.h/2, '#39ff14', 30);
                    if(lives <= 0) gameOver();
                }
            }
            bunkers.forEach(bnk => {
                if(!b.dead && bnk.checkCollision(b)) b.dead = true;
            });
        });

        powerups.forEach(p => {
            p.update();
            if(!p.dead && checkRect(p, player)) {
                p.dead = true;
                player.powerups[p.type] = 600; 
                playTone(800, 'sine', 0.2);
            }
        });

        player.bullets = player.bullets.filter(b => !b.dead);
        enemyBullets = enemyBullets.filter(b => !b.dead);
        enemies = enemies.filter(e => !e.dead);
        powerups = powerups.filter(p => !p.dead);
        particles = particles.filter(p => p.life > 0);
        particles.forEach(p => p.update());

        if(enemies.length === 0) {
            wave++;
            startWave();
        }

        if(screenShake > 0) screenShake *= 0.9;

        uiScore.innerText = score;
        uiWave.innerText = wave;
        uiLives.innerText = lives;
    }

    function checkRect(r1, r2) {
        return r1.x < r2.x + r2.w && r1.x + r1.w > r2.x &&
               r1.y < r2.y + r2.h && r1.y + r1.h > r2.y;
    }

    function draw() {
        ctx.fillStyle = '#050505';
        ctx.fillRect(0, 0, width, height);

        ctx.save();
        if(screenShake > 0.5) {
            ctx.translate((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake);
        }

        ctx.fillStyle = '#222';
        for(let i=0; i<50; i++) ctx.fillRect((i*137)%width, (i*233 + Date.now()*0.05)%height, 2, 2);

        player.draw();
        if(mysteryShip) mysteryShip.draw();
        enemies.forEach(e => e.draw());
        bunkers.forEach(b => b.draw());
        player.bullets.forEach(b => b.draw());
        enemyBullets.forEach(b => b.draw());
        powerups.forEach(p => p.draw());
        particles.forEach(p => p.draw());

        ctx.restore();
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    function updatePowerupUI() {
        uiPowerups.innerHTML = '';
        Object.keys(player.powerups).forEach(type => {
            const el = document.createElement('div');
            el.className = 'power-badge';
            el.innerText = type;
            el.style.borderColor = type === 'rapid' ? 'yellow' : (type === 'triple' ? '#ff0055' : 'cyan');
            el.style.color = el.style.borderColor;
            uiPowerups.appendChild(el);
        });
    }

    function startGame() {
        overlay.style.display = 'none';
        gameActive = true;
        if(audioCtx.state === 'suspended') audioCtx.resume();
        setNextUfoTime();
    }

    function gameOver() {
        gameActive = false;
        if(mysteryShip) mysteryShip.stopAudio();
        overlay.style.display = 'flex';
        overlay.innerHTML = `<h1>GAME OVER</h1><p>SCORE: ${score}</p><button onclick="location.reload()">RETRY</button>`;
    }

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    window.addEventListener('resize', resize);
    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);

    init();

</script>
</body>
