(function () {
    const allowedOrigin = location.origin;

    // Block window.open to external sites
    const originalOpen = window.open;
    window.open = function (url, name, features) {
        try {
            const target = new URL(url, location.href);
            if (target.origin !== allowedOrigin) {
                console.warn("Blocked external window.open:", url);
                return null;
            }
        } catch (e) {}
        return originalOpen.call(window, url, name, features);
    };

    // Block external redirects via location changes
    const originalAssign = window.location.assign;
    const originalReplace = window.location.replace;

    window.location.assign = function (url) {
        const target = new URL(url, location.href);
        if (target.origin !== allowedOrigin) {
            console.warn("Blocked external redirect:", url);
            return;
        }
        return originalAssign.call(window.location, url);
    };

    window.location.replace = function (url) {
        const target = new URL(url, location.href);
        if (target.origin !== allowedOrigin) {
            console.warn("Blocked external redirect:", url);
            return;
        }
        return originalReplace.call(window.location, url);
    };
})();
