<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Gambit: Fullscreen</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --overlay-bg: rgba(0, 0, 0, 0.85);
            --panel-bg: rgba(20, 20, 20, 0.8);
            --border: 1px solid rgba(255,255,255,0.15);
            
            /* Colors */
            --c-red: #ff3333;
            --c-blue: #3388ff;
            --c-yellow: #ffcc00;
            --c-green: #33ff33;
            --c-white: #00f2ff;
            --c-black: #ff0055;
            
            /* Dynamic sizing calculated in JS or vmin */
            --sq-size: 6.5vmin; /* Fits 14x14 nicely in viewport */
        }

        body {
            margin: 0; background-color: var(--bg-color); color: white;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden; user-select: none;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; width: 100vw;
            background-image: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #000 90%);
        }

        /* --- Fullscreen Layout --- */
        #game-container {
            position: relative;
            display: flex; justify-content: center; align-items: center;
            width: 100vw; height: 100vh;
        }

        #board-area {
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            border-radius: 4px;
            /* No border/background here to let squares shine */
        }

        /* --- Boards --- */
        .game-board { display: none; }
        
        /* 2P Board: 8x8 */
        #board-2p {
            display: grid;
            grid-template-columns: repeat(8, var(--sq-size));
            grid-template-rows: repeat(8, var(--sq-size));
            border: 2px solid #333;
        }

        /* 4P Board: 14x14 */
        #board-4p {
            display: grid;
            grid-template-columns: repeat(14, calc(var(--sq-size) * 0.6)); /* Smaller squares for 4p to fit */
            grid-template-rows: repeat(14, calc(var(--sq-size) * 0.6));
            position: relative;
        }
        @media (min-width: 1000px) {
            #board-4p {
                grid-template-columns: repeat(14, 5.5vmin);
                grid-template-rows: repeat(14, 5.5vmin);
            }
        }

        /* --- Squares & Pieces --- */
        .square {
            display: flex; justify-content: center; align-items: center;
            position: relative;
        }
        .sq-dark { background-color: #151515; }
        .sq-light { background-color: #2a2a2a; }
        .sq-void { background: transparent; pointer-events: none; }

        .highlight { background-color: rgba(255, 255, 255, 0.2) !important; box-shadow: inset 0 0 10px white; }
        .last-move { background-color: rgba(255, 215, 0, 0.25) !important; }
        .hint-dot { width: 25%; height: 25%; background: rgba(255,255,255,0.4); border-radius: 50%; pointer-events: none; }
        .hint-capture { border: 2px solid rgba(255, 50, 50, 0.6); width: 100%; height: 100%; position: absolute; box-sizing: border-box; }

        .piece {
            width: 90%; height: 90%;
            background-repeat: no-repeat; background-position: center; background-size: contain;
            transition: transform 0.15s; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.8));
            z-index: 10; cursor: pointer;
        }
        .piece:hover { transform: scale(1.15); }

        /* Color Themes */
        .p-red { color: var(--c-red); filter: drop-shadow(0 0 5px var(--c-red)); }
        .p-blue { color: var(--c-blue); filter: drop-shadow(0 0 5px var(--c-blue)); }
        .p-yellow { color: var(--c-yellow); filter: drop-shadow(0 0 5px var(--c-yellow)); }
        .p-green { color: var(--c-green); filter: drop-shadow(0 0 5px var(--c-green)); }
        .p-white { color: var(--c-white); filter: drop-shadow(0 0 5px var(--c-white)); }
        .p-black { color: var(--c-black); filter: drop-shadow(0 0 5px var(--c-black)); }
        .p-grey { filter: grayscale(100%) opacity(0.3); pointer-events: none; }

        /* --- HUD / Overlays --- */
        #hud {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 20px; z-index: 100;
        }
        .hud-badge {
            background: var(--panel-bg); padding: 8px 16px; border-radius: 20px;
            font-weight: bold; border: var(--border); backdrop-filter: blur(5px);
            display: flex; align-items: center; gap: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            transition: all 0.3s;
        }
        #turn-badge.active { transform: scale(1.1); border-color: white; }

        #controls {
            position: absolute; bottom: 20px; right: 20px;
            display: flex; flex-direction: column; gap: 10px;
        }
        .btn-mini {
            background: #333; color: white; border: var(--border);
            width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s;
        }
        .btn-mini:hover { background: white; color: black; }

        /* --- SETUP MODAL --- */
        #setup-modal {
            position: fixed; inset: 0;
            background: var(--overlay-bg);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: flex; justify-content: center; align-items: center;
        }
        
        .modal-content {
            background: #111; border: var(--border);
            width: 90%; max-width: 500px;
            border-radius: 16px; padding: 30px;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
        }

        h2 { margin: 0 0 20px 0; text-align: center; text-transform: uppercase; letter-spacing: 2px; color: #fff; }

        .mode-selector {
            display: flex; background: #222; border-radius: 8px; padding: 4px; margin-bottom: 20px;
        }
        .mode-opt {
            flex: 1; text-align: center; padding: 10px; cursor: pointer;
            border-radius: 6px; font-weight: bold; color: #888;
        }
        .mode-opt.active { background: #444; color: white; }

        .player-row {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 12px; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 8px;
        }
        .p-label { font-weight: bold; display: flex; align-items: center; gap: 10px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
        
        select.p-select {
            background: #000; color: white; border: 1px solid #444;
            padding: 5px 10px; border-radius: 4px; font-family: inherit;
        }

        .btn-start {
            width: 100%; padding: 15px; margin-top: 20px;
            background: linear-gradient(90deg, var(--c-blue), var(--c-white));
            border: none; border-radius: 8px; font-weight: bold; font-size: 16px;
            cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
            transition: transform 0.2s;
        }
        .btn-start:hover { transform: scale(1.02); }

        #svg-defs { display: none; }
    </style>
</head>
<body>

<div id="svg-defs">
    <svg id="icon-p"><path fill="currentColor" d="M22.5 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.94 3.84 2.41 5.03-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47 1.47-1.19 2.41-3 2.41-5.03 0-2.41-1.33-4.5-3.28-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z"/></svg>
    <svg id="icon-n"><path fill="currentColor" d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21M24 18c.38 2.32-4.68 1.97-5 0 0-3.5 3-7 5-7 5 0 2 11 6 11 2 0 3-2 3-2 .5 2.5-3.5 3.5-3 6"/></svg>
    <svg id="icon-b"><path fill="currentColor" d="M9 36c3.39-.47 5.5-2 5.5-2 3.63 1.35 2.76 1.35 6.5 1.35 3.74 0 2.87 0 6.5-1.35 0 0 2.11 1.53 5.5 2V32h-24v4zm17-4c1.76 0 3-3.6 3-8 0-4.97-3.66-9-7-9-3.34 0-7 4.03-7 9 0 4.4 1.24 8 3 8zM22 9c-1.66 0-3 1.34-3 3 0 1.66 1.34 3 3 3 1.66 0 3-1.34 3-3 0-1.66-1.34-3-3-3z"/></svg>
    <svg id="icon-r"><path fill="currentColor" d="M9 39h27v-3H9v3zM12 36v-4h21v4H12zM11 14V9h4v2h5V9h5v2h5V9h4v5M34 14l-3 3H14l-3-3M31 17v12.5H14V17h17zm-16 6a2 2 0 1 1-4 0 2 2 0 1 1 4 0z"/></svg>
    <svg id="icon-q"><path fill="currentColor" d="M9 26c8.5-1.5 21-1.5 27 0l2-12-7 11V11l-5.5 13.5-3-15-3 15-5.5-14.5V25L9 14l2 12zM9 26c0 2 1.5 2 2.5 4 1 2.5 1 4.5 1 4.5h20c0 0 0-2 .5-4.5 1-2 2.5-2 2.5-4-8.5-1.5-18.5-1.5-26.5 0z"/></svg>
    <svg id="icon-k"><path fill="currentColor" d="M22.5 11.63V6M20 8h5M22.5 25s4.5-7.5 3-10.5c0 0-1-2.5-3-2.5s-3 2.5-3 2.5c-1.5 3 3 10.5 3 10.5M11.5 37c5.5 3.5 15.5 3.5 21 0v-7s9-4.5 6-10.5c-4-1-5 5.5-5 5.5l-6 3s-1.5 1-4.5 1c-3 0-4.5-1-4.5-1l-6-3s-1-6.5-5-5.5c-3 6 6 10.5 6 10.5v7z"/></svg>
</div>

<div id="setup-modal">
    <div class="modal-content">
        <h2>New Game</h2>
        
        <div class="mode-selector">
            <div class="mode-opt active" id="opt-2p" onclick="UI.setMode('2p')">Classic (2P)</div>
            <div class="mode-opt" id="opt-4p" onclick="UI.setMode('4p')">Chaos (4P)</div>
        </div>

        <div id="settings-2p">
            <div class="player-row">
                <span class="p-label"><span class="dot" style="background:var(--c-white)"></span> White</span>
                <select id="p2-white" class="p-select">
                    <option value="human">Human</option>
                    <option value="bot">Bot</option>
                </select>
            </div>
            <div class="player-row">
                <span class="p-label"><span class="dot" style="background:var(--c-black)"></span> Black</span>
                <select id="p2-black" class="p-select">
                    <option value="bot" selected>Bot</option>
                    <option value="human">Human</option>
                </select>
            </div>
        </div>

        <div id="settings-4p" style="display:none">
            <div class="player-row">
                <span class="p-label"><span class="dot" style="background:var(--c-red)"></span> Red</span>
                <select id="p4-red" class="p-select">
                    <option value="human">Human</option>
                    <option value="bot">Bot</option>
                </select>
            </div>
            <div class="player-row">
                <span class="p-label"><span class="dot" style="background:var(--c-blue)"></span> Blue</span>
                <select id="p4-blue" class="p-select">
                    <option value="bot">Bot</option>
                    <option value="human">Human</option>
                </select>
            </div>
            <div class="player-row">
                <span class="p-label"><span class="dot" style="background:var(--c-yellow)"></span> Yellow</span>
                <select id="p4-yellow" class="p-select">
                    <option value="bot">Bot</option>
                    <option value="human">Human</option>
                </select>
            </div>
            <div class="player-row">
                <span class="p-label"><span class="dot" style="background:var(--c-green)"></span> Green</span>
                <select id="p4-green" class="p-select">
                    <option value="bot">Bot</option>
                    <option value="human">Human</option>
                </select>
            </div>
        </div>

        <button class="btn-start" onclick="UI.startGame()">Enter Arena</button>
    </div>
</div>

<div id="game-container">
    <div id="hud">
        <div class="hud-badge" id="turn-badge">
            <span class="dot" id="turn-dot" style="background:white"></span>
            <span id="turn-text">Waiting...</span>
        </div>
    </div>

    <div id="board-area">
        <div id="board-2p" class="game-board"></div>
        <div id="board-4p" class="game-board"></div>
    </div>

    <div id="controls">
        <div class="btn-mini" onclick="UI.showModal()" title="Settings/New Game"><i class="fas fa-cog"></i></div>
        <div class="btn-mini" onclick="UI.toggleFull()" title="Fullscreen"><i class="fas fa-expand"></i></div>
    </div>
</div>

<script>
    // --- Audio Engine ---
    const AudioEngine = {
        ctx: new (window.AudioContext || window.webkitAudioContext)(),
        play: function(type) {
            if (this.ctx.state === 'suspended') this.ctx.resume();
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.connect(gain); gain.connect(this.ctx.destination);
            const now = this.ctx.currentTime;

            if (type === 'move') {
                osc.frequency.setValueAtTime(250, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'capture') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            }
        }
    };

    // --- Asset Helper ---
    function getPieceHTML(type, colorClass) {
        const svgId = 'icon-' + type;
        const svgContent = document.getElementById(svgId).innerHTML;
        return `<div class="piece ${colorClass}"><svg viewBox="0 0 45 45">${svgContent}</svg></div>`;
    }

    // --- UI Controller ---
    const UI = {
        mode: '2p',
        
        setMode: function(m) {
            this.mode = m;
            document.getElementById('opt-2p').classList.toggle('active', m === '2p');
            document.getElementById('opt-4p').classList.toggle('active', m === '4p');
            document.getElementById('settings-2p').style.display = m === '2p' ? 'block' : 'none';
            document.getElementById('settings-4p').style.display = m === '4p' ? 'block' : 'none';
        },

        showModal: function() {
            document.getElementById('setup-modal').style.display = 'flex';
        },

        startGame: function() {
            document.getElementById('setup-modal').style.display = 'none';
            document.getElementById('board-2p').style.display = this.mode === '2p' ? 'grid' : 'none';
            document.getElementById('board-4p').style.display = this.mode === '4p' ? 'grid' : 'none';

            if(this.mode === '2p') {
                const config = {
                    w: document.getElementById('p2-white').value,
                    b: document.getElementById('p2-black').value
                };
                Game2P.init(config);
            } else {
                const config = {
                    red: document.getElementById('p4-red').value,
                    blue: document.getElementById('p4-blue').value,
                    yellow: document.getElementById('p4-yellow').value,
                    green: document.getElementById('p4-green').value
                };
                Game4P.init(config);
            }
        },

        updateHUD: function(color, text) {
            const badge = document.getElementById('turn-badge');
            const dot = document.getElementById('turn-dot');
            const label = document.getElementById('turn-text');
            
            label.innerText = text;
            badge.style.borderColor = color;
            dot.style.background = color;
            badge.classList.remove('active');
            void badge.offsetWidth; // trigger reflow
            badge.classList.add('active');
        },

        toggleFull: function() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }
    };

    // ==========================================
    // 2 PLAYER ENGINE
    // ==========================================
    const Game2P = {
        chess: null,
        config: {},
        selected: null,
        boardEl: document.getElementById('board-2p'),

        init: function(config) {
            this.chess = new Chess();
            this.config = config;
            this.selected = null;
            this.render();
            this.processTurn();
        },

        processTurn: function() {
            if(this.chess.game_over()) {
                UI.updateHUD('#fff', 'Game Over');
                return;
            }
            const turn = this.chess.turn(); // 'w' or 'b'
            const type = this.config[turn];
            const colorName = turn === 'w' ? 'White' : 'Black';
            const hex = turn === 'w' ? 'var(--c-white)' : 'var(--c-black)';

            UI.updateHUD(hex, `${colorName} (${type === 'human' ? 'You' : 'Bot'})`);

            if(type === 'bot') {
                setTimeout(() => this.aiMove(), 600);
            }
        },

        handleClick: function(square) {
            const turn = this.chess.turn();
            // Only allow interaction if Human
            if(this.config[turn] !== 'human') return;

            // Move
            if(this.selected) {
                const move = this.chess.move({ from: this.selected, to: square, promotion: 'q' });
                if(move) {
                    AudioEngine.play(move.flags.includes('c') ? 'capture' : 'move');
                    this.selected = null;
                    this.render();
                    this.processTurn();
                    return;
                }
            }

            // Select
            const piece = this.chess.get(square);
            if(piece && piece.color === turn) {
                this.selected = square;
                this.render();
            } else {
                this.selected = null;
                this.render();
            }
        },

        aiMove: function() {
            const moves = this.chess.moves();
            if(moves.length === 0) return;
            
            // Simple Random AI (can be improved to Minimax if desired)
            const randomMove = moves[Math.floor(Math.random() * moves.length)];
            const move = this.chess.move(randomMove);
            AudioEngine.play(move.flags.includes('c') ? 'capture' : 'move');
            this.render();
            this.processTurn();
        },

        render: function() {
            this.boardEl.innerHTML = '';
            const board = this.chess.board();
            
            for(let r=0; r<8; r++){
                for(let c=0; c<8; c++){
                    const sq = document.createElement('div');
                    sq.className = `square ${(r+c)%2===0 ? 'sq-light' : 'sq-dark'}`;
                    const sqId = String.fromCharCode(97+c) + (8-r);
                    sq.onclick = () => this.handleClick(sqId);

                    // Highlight
                    if(this.selected === sqId) sq.classList.add('highlight');
                    
                    // Piece
                    const p = board[r][c];
                    if(p) {
                        const colorClass = p.color === 'w' ? 'p-white' : 'p-black';
                        sq.innerHTML = getPieceHTML(p.type, colorClass);
                    }

                    // Hint
                    if(this.selected) {
                        const moves = this.chess.moves({square: this.selected, verbose: true});
                        const move = moves.find(m => m.to === sqId);
                        if(move) {
                            const hint = document.createElement('div');
                            if(this.chess.get(sqId)) hint.className = 'hint-capture';
                            else hint.className = 'hint-dot';
                            sq.appendChild(hint);
                        }
                    }
                    this.boardEl.appendChild(sq);
                }
            }
        }
    };

    // ==========================================
    // 4 PLAYER ENGINE
    // ==========================================
    const Game4P = {
        board: [],
        config: {},
        players: ['red', 'blue', 'yellow', 'green'],
        active: [true, true, true, true],
        turnIdx: 0,
        selected: null,
        boardEl: document.getElementById('board-4p'),

        init: function(config) {
            this.config = config;
            this.board = Array(14).fill(null).map(() => Array(14).fill(null));
            this.turnIdx = 0;
            this.active = [true, true, true, true];
            this.selected = null;
            this.setupPieces();
            this.render();
            this.processTurn();
        },

        processTurn: function() {
            // Check win condition
            const alive = this.active.filter(x => x).length;
            if(alive <= 1) {
                UI.updateHUD('#fff', 'Game Over - Winner!');
                return;
            }

            const color = this.players[this.turnIdx];
            const type = this.config[color];
            
            // Map color to CSS var for HUD
            const hexMap = {'red':'var(--c-red)', 'blue':'var(--c-blue)', 'yellow':'var(--c-yellow)', 'green':'var(--c-green)'};
            
            UI.updateHUD(hexMap[color], `${color.toUpperCase()} (${type === 'human' ? 'You' : 'Bot'})`);

            if(type === 'bot') {
                setTimeout(() => this.runAI(), 700);
            }
        },

        isValidSq: function(x, y) {
            if(x < 0 || x > 13 || y < 0 || y > 13) return false;
            // Corners (3x3 blocks)
            if((x < 3 || x > 10) && (y < 3 || y > 10)) return false;
            return true;
        },

        setupPieces: function() {
            const place = (x, y, c, t) => this.board[y][x] = { color: c, type: t, moved: false };
            const rank = ['r','n','b','k','q','b','n','r'];
            
            // Red (Bottom)
            for(let i=0; i<8; i++) { place(3+i, 13, 'red', rank[i]); place(3+i, 12, 'red', 'p'); }
            // Yellow (Top)
            for(let i=0; i<8; i++) { place(3+i, 0, 'yellow', rank[i]); place(3+i, 1, 'yellow', 'p'); }
            // Blue (Left)
            for(let i=0; i<8; i++) { place(0, 3+i, 'blue', rank[i]); place(1, 3+i, 'blue', 'p'); }
            // Green (Right)
            for(let i=0; i<8; i++) { place(13, 3+i, 'green', rank[i]); place(12, 3+i, 'green', 'p'); }
        },

        handleClick: function(x, y) {
            const color = this.players[this.turnIdx];
            if(this.config[color] !== 'human') return; // Not human turn

            if(this.selected) {
                // Try Move
                if(this.isValidMove(this.selected.x, this.selected.y, x, y, this.selected.p)) {
                    this.executeMove(this.selected.x, this.selected.y, x, y);
                    return;
                }
            }

            // Select
            const p = this.board[y][x];
            if(p && p.color === color && this.active[this.turnIdx]) {
                this.selected = {x, y, p};
                this.render();
            } else {
                this.selected = null;
                this.render();
            }
        },

        executeMove: function(fx, fy, tx, ty) {
            const p = this.board[fy][fx];
            const target = this.board[ty][tx];
            
            if(target) {
                AudioEngine.play('capture');
                if(target.type === 'k') this.eliminate(target.color);
            } else {
                AudioEngine.play('move');
            }

            this.board[ty][tx] = p;
            this.board[fy][fx] = null;
            p.moved = true;
            
            // Auto-promote pawns roughly at boundaries for simplicity
            if(p.type === 'p') {
               const dir = this.getDir(p.color);
               if(!this.isValidSq(tx+dir.x, ty+dir.y)) p.type = 'q';
            }

            this.selected = null;
            this.nextTurn();
        },

        eliminate: function(color) {
            const idx = this.players.indexOf(color);
            this.active[idx] = false;
        },

        nextTurn: function() {
            let next = this.turnIdx;
            let count = 0;
            do {
                next = (next + 1) % 4;
                count++;
            } while(!this.active[next] && count < 4);
            
            this.turnIdx = next;
            this.render();
            this.processTurn();
        },

        getDir: function(c) {
            if(c === 'red') return {x:0, y:-1};
            if(c === 'yellow') return {x:0, y:1};
            if(c === 'blue') return {x:1, y:0};
            return {x:-1, y:0};
        },

        isValidMove: function(fx, fy, tx, ty, p) {
            if(!this.isValidSq(tx, ty)) return false;
            const target = this.board[ty][tx];
            if(target && target.color === p.color) return false;
            
            const dx = tx - fx, dy = ty - fy;
            const adx = Math.abs(dx), ady = Math.abs(dy);

            // Simplified rules for 4P geometry
            switch(p.type) {
                case 'n': return (adx===2 && ady===1) || (adx===1 && ady===2);
                case 'b': if(adx !== ady) return false; return this.clearPath(fx, fy, tx, ty);
                case 'r': if(dx!==0 && dy!==0) return false; return this.clearPath(fx, fy, tx, ty);
                case 'q': if(dx!==0 && dy!==0 && adx!==ady) return false; return this.clearPath(fx, fy, tx, ty);
                case 'k': return adx <= 1 && ady <= 1;
                case 'p':
                    const d = this.getDir(p.color);
                    // Move 1
                    if(dx === d.x && dy === d.y && !target) return true;
                    // Move 2
                    if(!p.moved && dx === d.x*2 && dy === d.y*2 && !target && !this.board[fy+d.y][fx+d.x]) return true;
                    // Capture
                    if(adx===1 && ady===1 && target) {
                        // Forward diag check
                        if((p.color==='red'||p.color==='yellow') && dy===d.y) return true;
                        if((p.color==='blue'||p.color==='green') && dx===d.x) return true;
                    }
                    return false;
            }
            return false;
        },

        clearPath: function(fx, fy, tx, ty) {
            const sx = Math.sign(tx - fx), sy = Math.sign(ty - fy);
            let cx = fx + sx, cy = fy + sy;
            while(cx !== tx || cy !== ty) {
                if(!this.isValidSq(cx, cy)) return false;
                if(this.board[cy][cx]) return false;
                cx += sx; cy += sy;
            }
            return true;
        },

        runAI: function() {
            const color = this.players[this.turnIdx];
            // Gather pieces
            const pieces = [];
            for(let y=0; y<14; y++) for(let x=0; x<14; x++) {
                if(this.board[y][x] && this.board[y][x].color === color) pieces.push({x, y, p:this.board[y][x]});
            }
            
            // Random Shuffle
            pieces.sort(() => Math.random() - 0.5);

            // Find first valid move (Capture prioritized)
            for(let piece of pieces) {
                // Check 8 directions + knight jumps approx by scanning board (inefficient but works for small JS)
                for(let y=0; y<14; y++) for(let x=0; x<14; x++) {
                    if(this.isValidMove(piece.x, piece.y, x, y, piece.p)) {
                        this.executeMove(piece.x, piece.y, x, y);
                        return;
                    }
                }
            }
            // Stuck?
            this.eliminate(color); // Resign if no moves
            this.nextTurn();
        },

        render: function() {
            this.boardEl.innerHTML = '';
            for(let y=0; y<14; y++) {
                for(let x=0; x<14; x++) {
                    const sq = document.createElement('div');
                    sq.className = 'square';
                    if(!this.isValidSq(x, y)) {
                        sq.classList.add('sq-void');
                    } else {
                        sq.classList.add((x+y)%2===0 ? 'sq-light' : 'sq-dark');
                        sq.onclick = () => this.handleClick(x, y);

                        const p = this.board[y][x];
                        if(p) {
                            const cName = 'p-' + p.color;
                            const cls = this.active[this.players.indexOf(p.color)] ? cName : 'p-grey';
                            sq.innerHTML = getPieceHTML(p.type, cls);
                        }

                        if(this.selected && this.selected.x===x && this.selected.y===y) sq.classList.add('highlight');
                        
                        // Hints
                        if(this.selected && this.isValidMove(this.selected.x, this.selected.y, x, y, this.selected.p)) {
                            const hint = document.createElement('div');
                            if(this.board[y][x]) hint.className = 'hint-capture';
                            else hint.className = 'hint-dot';
                            sq.appendChild(hint);
                        }
                    }
                    this.boardEl.appendChild(sq);
                }
            }
        }
    };

    // Load setup initially
    UI.setMode('2p');
</script>
</body>
