<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | Math Master</title>
    <link rel="stylesheet" href="Style.css">
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #ffffff; /* Matches your site background */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 50px 40px;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-backdrop);
            -webkit-backdrop-filter: var(--glass-backdrop);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-soft);
            max-width: 450px;
            width: 90%;
            animation: fadeIn 0.8s ease-out;
        }

        /* The Pulse Animation for the Icon/Text */
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-box {
            font-size: 50px;
            margin-bottom: 20px;
            display: inline-block;
            animation: pulse 3s infinite ease-in-out;
        }

        h1 {
            color: var(--text-primary);
            font-size: 36px;
            margin: 0;
            letter-spacing: -1px;
            font-weight: 800; /* Bolded */
        }

        p {
            color: var(--text-secondary);
            font-size: 16px;
            margin-top: 15px;
            line-height: 1.5;
            font-weight: 400; /* Unbolded */
            opacity: 0.7;
        }

        .accent-bar {
            width: 50px;
            height: 4px;
            background: var(--accent-color);
            margin: 25px auto 0;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon-box">⏳</div>
        <h1><b>Coming Soon!</b></h1>
        <p>This game is still in beta, this page is a placeholder for the real game.</p>
        <div class="accent-bar"></div>
    </div>

</body>
</html>
